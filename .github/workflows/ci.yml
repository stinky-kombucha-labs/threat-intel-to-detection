name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[sigma]"
      - name: Validate every rule file
        run: python -m intel_to_rule validate
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -t .
      - name: Generated queries are up to date
        run: |
          python -m intel_to_rule convert
          git diff --exit-code rules/generated
